server {
    listen 80;
    root /usr/share/nginx/html;

    # O padrão do Nginx é 1 MB; a API aceita PDFs de até 5 MB, mais a folga do multipart.
    client_max_body_size 6m;

    # Mesmo papel do proxy.conf.json no dev server: o frontend chama caminhos
    # relativos e não precisa de CORS.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Rotas do Angular (como /candidatos/1) são resolvidas no navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
