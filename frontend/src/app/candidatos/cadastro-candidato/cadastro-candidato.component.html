<h1>Novo candidato</h1>

<form [formGroup]="formulario" (ngSubmit)="salvar()" novalidate>
  <mat-form-field>
    <mat-label>Nome completo</mat-label>
    <input matInput formControlName="nomeCompleto" autocomplete="name" required>
  </mat-form-field>

  <mat-form-field>
    <mat-label>E-mail</mat-label>
    <input matInput type="email" formControlName="email" autocomplete="email" required>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Telefone</mat-label>
    <input matInput type="tel" formControlName="telefone" autocomplete="tel">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Área ou cargo de interesse</mat-label>
    <input matInput formControlName="areaOuCargoDeInteresse">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Resumo profissional</mat-label>
    <textarea matInput formControlName="resumoProfissional" rows="6"></textarea>
  </mat-form-field>

  @if (falhaAoSalvar()) {
    <p class="falha" role="alert">Não foi possível salvar o candidato. Tente novamente.</p>
  }

  <div class="acoes">
    <a mat-button routerLink="/candidatos">Cancelar</a>
    <button mat-flat-button type="submit" [disabled]="salvando()">
      @if (salvando()) {
        <mat-spinner diameter="18" />
        Salvando…
      } @else {
        Salvar
      }
    </button>
  </div>
</form>
